[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-sim"
version = "0.0.1"
description = "Simulation of the Weiss-group Cs 3D optical lattice: light field, magnetic field, trapping, transport, collisional gates and noise"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7", "numba>=0.59", "sympy>=1.12"]   # drawing tests and scripts/ import matplotlib; molasses tests numba, sympy
molasses = ["numba>=0.59", "sympy>=1.12"]   # lattice_sim.molasses (Monte Carlo kernels; Clebsch-Gordan algebra)
viz = ["matplotlib>=3.7"]
quantum = ["qutip>=5"]
gpu = ["jax"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
