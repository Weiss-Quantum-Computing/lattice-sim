# Apparatus parameters for lattice-sim.
#
# Source: "Lattice Beams & Magnetic Fields: Parameter Reference" (Lattice Sim
# project, 7 Oct 2026), which compiles six Weiss-group theses and Maarten's
# current values. Each entry carries `source`; `status` is one of
#   current   - stated for the apparatus as it is now
#   thesis    - taken from a thesis, not re-verified
#   computed  - derived, not measured
#   open      - unknown or in conflict; the simulation must treat it as a scan
# Units are in the key names.

lattice:
  wavelength_nm: {value: 843.222, status: current}
  spacing_um:
    value: {x: 4.837, y: 4.837, z: 4.837}
    status: computed
    note: "lambda / (2 sin 5 deg); 10 deg crossing angle is nominal, spacing should be measured per axis"
  waist_um: {value: 60, status: thesis, source: "Li p.29; Kumar p.14; Wu p.19", note: "unmeasured at the atoms"}
  polarization: {value: "linear, perpendicular to the plane of each pair", status: thesis, source: "Li p.29-30; Kumar p.62"}
  layout:
    value: "X and Z pairs enter from the same side; Y enters from the side 90 deg counterclockwise, viewed from above; z is the vertical imaging axis"
    status: current
  trap_frequency_full_depth_kHz: {value: {x: 19.0, y: 16.0, z: 12.5}, status: current}
  depth_full_MHz:
    value: {x: 5.6, y: 4.0, z: 2.4}
    status: computed
    note: "U = 2 m a^2 f^2"
  gate_depth_fraction: {value: 0.25, status: thesis, source: "Kumar p.29; Wang p.33", note: "quarter depth = half the trap frequency"}
  input_extinction_ratio: {value: 1.0e4, status: thesis, source: "Du p.101", note: "lower bound"}
  scattering_rate_per_s:
    value: 0.12
    at: "4 MHz depth, 838.9 nm"
    status: thesis
    source: "Kumar p.30"
    note: "x1.5 per unit depth at 843.222 nm (computed); x17 during motion (Wu p.48)"
  intensity_lock:
    value: "PDA100A2 + VCA actuator, 350 kHz bandwidth run at ~180 kHz; residual ~50 Hz table peak"
    status: thesis
    source: "Du p.96-100"
  rin_at_2_omega_trap_per_rtHz: {value: 0.5e-6, status: thesis, source: "Wu p.33"}

polarization_rotator:
  hardware:
    value: "one arm per pair: 2 EOMs at 45 deg + quarter-wave plate; phi = pi at V_half_wave"
    status: thesis
    source: "Kumar p.60-66; Wu p.47-48; Du p.102 (new EOMs, independent voltages)"
  v_half_wave_kV: {value: 5.5, status: thesis, note: "Transport-Optimizer uses 5.4 kV full scale"}
  driver: {value: "Trek 610-series, 20 V/us", status: current}
  rotating_arm:
    value: {x: right, y: left, z: top}
    status: current
    note: "arms named with each pair drawn as /\\"
  transport_direction:
    value: "x: |4,-4> moves toward the EO arm, |3,-3> away from it (EO arm is the one closest to the OP beam)"
    status: current
    note: "matches the model with rotation_sense = +1, B_q at +45 deg (EO arm side = +x); fixes the product of rotation sense and field sign, which is all the motion depends on. Matches the ER316 calibration files' sign convention."
  ellipticity_handedness:
    value: null
    status: open
    note: "decides which partner of each pair is deepened at theta = pi/2. Measure f(|4,-4>)/f(|3,-3>) parked at pi/2: ~1.86 (h = -1) vs ~1.01 (h = +1) at ER 316, 1.33 for pure linear (figures/robust_ramps.png d)"
  extinction_ratio_vs_angle:
    value: "data/measured/133-ms-SE-offset-neg2V-fine-2_extinction.csv (x, 2026-10-07, ramp polarimeter, dip method)"
    status: current
    note: ">3e4 (lower bound) within +-15 deg of pi/2; ~1000-1400 at 135-150 deg (back ramp ~25 % lower than away); 1500-3500 at rest and hold; legs 1 and 2 agree within errors except a few points. |ellipticity| only, no handedness."

magnetic_field:
  quantization_field_G: {value: 1.39304, status: computed, note: "Breit-Rabi magic field for |3,-1>-|4,+1>; theses quote 1.393 G"}
  direction:
    value: "approx. 45 deg in the lattice x-y plane, along the optical-pumping beam"
    status: open
    source: "Du p.76"
    note: "keep the angle settable; sign relative to the lattice axes unresolved"
  bias_coils:
    x: {radius_in: 6.0, separation_in: 6.0, turns: 36, A_per_G: 0.471, status: thesis, source: "Li p.23"}
    y: {radius_in: 6.0, separation_in: 14.0, turns: 36, A_per_G: 1.222, status: thesis, source: "Li p.23"}
    z: {radius_in: 4.5, separation_in: 5.125, turns: 36, A_per_G: 0.385, status: thesis, source: "Li p.23"}
  compensation_coils: {value: "2 turns on X and Y bias coils; none on Z", status: thesis, source: "Du p.77"}
  lock: {value: "Bartington MAG-13 fluxgate ~4 cm from atoms, loop bandwidth ~1.5 kHz", status: thesis, source: "Du p.76-85"}
  noise:
    line_60Hz_unlocked_mG_pp: {value: 1.0, status: thesis, source: "Kumar p.63"}
    hvac_Hz: {value: [30, 34], status: thesis, source: "Giraldo p.54"}
    echo_phase_rms_stretched_pi: {value: 0.054, condition: "1/60 s echo, locked", status: thesis, source: "Du p.94"}
    psd: {value: null, status: open, note: "absolute-unit field spectrum needed"}

states:
  storage: {value: [[3, -1], [4, 1]], status: current}
  transport_candidates:
    value: [[[3, -1], [3, 1]], [[3, -3], [3, 3]]]
    status: open
    note: "choice depends on the relative size of the noise sources; the simulation compares both"

calibrations:
  transport_optimizer_ER316:
    value: "calibration_{F3,F4}_10kHz_ER316.csv in Transport-Optimizer"
    status: computed
    note: "ER316 = rotating-arm extinction ratio 316:1 (25 dB). The first-principles model reproduces the theta = 0 F3/F4 trap-frequency split (101.2 vs 101.1 Hz); see tests/test_lattice_potential.py. Mid-rotation residuals up to 0.13 um and 0.75 kHz near theta = pi/2 remain (figures/er316_comparison.png)."

cooling:
  sequence:
    value: "per axis: -2 AFP at theta_-2 (2f above carrier, HSR -6 kHz), -1 AFP at theta_-1 (f above carrier), OP at theta = 0; loop 1 30 cycles at ~12/6 deg (-1 HSR -4 kHz), loop 2 10 cycles at ~13/12 deg (-1 HSR -6 kHz); order x, y, z"
    status: current
    source: "Maarten, 2026-10-13 (angles approximate)"
  afp_duration_ms: {value: 3, status: current}
  reference_fc_Hz: {value: 56592433.1, status: current, note: "DDS reference; assumed to be the theta = 0 carrier"}
  offset_minus1_kHz: {value: {x: 18.1, y: 15.1, z: 12.5}, status: current, note: "-2 offsets are 2x; full depth"}
  afp_power_W: {value: {minus2: 0.1425, minus1: 0.075}, status: current, source: "Freq-Scan-GUI output/Coolscan-manifest.json (2026-10-13), p_m2 / p_m1; same in both loops"}
  mw_pi_power_calibration: {value: {power_W: 0.306, blackman_pi_ms: 0.12}, status: current, source: "dds-control scripts/Powerscan.py:317, Freqscan.py:337 (f4new = |4,-4> -> |3,-3>, after the April 2022 power-supply change; was 0.318 W)"}
  afp_peak_rabi_kHz: {value: {minus2: 6.77, minus1: 4.91}, status: computed, note: "Blackman amplitude area 0.42 T (pulse.h:945), Rabi ~ sqrt(power); calibration taken as the bare (coupling-1) value (cooling/afp.py CAL_IS_BARE_COUPLING); replaces the 20 kHz of Du App. A used until 2026-10-15"}
  initial_temperature_uK: {value: 5, status: thesis, source: "Wu p.26"}
  measured_3d_ground_fraction: {value: 0.96, status: thesis, source: "Du p.48"}

molasses:
  detuning_MHz:
    value: {previous: -51, current: open}
    status: open
    source: "Maarten, 2026-10-29 ('50ish MHz', then moved closer to resonance); memory: -51 MHz limited by the 75 MHz VCO/VCA of the single-pass AOM"
  intensity_per_beam_mW_cm2: {value: 0.7, status: thesis, source: "Li p.58 (minimum lattice temperature at ~0.7 mW/cm^2 per beam)", note: "default of model.Config; current value open (data request 33)"}
  geometry:
    value: "three beams up through the cell bottom at Brewster's angle (55.4 deg from vertical), p-polarized, retro-reflected s-polarized (lin-perp-lin per pair); azimuths 270, 45, 135 deg from lattice x"
    status: open
    source: "Li 2009 (Brewster entry, MOT beam angles 81/117 deg); azimuths assumed (beams.AZIMUTHS_DEG)"
  pgc_duration_ms: {value: 250, status: thesis, source: "Li p.46"}
  image_exposure_ms: {value: 50, status: thesis, source: "Li p.54"}
  hopping_attempt_rate_per_s: {value: 265, status: thesis, source: "Li p.57-58 (Arrhenius fit, T = 10 uK, 15 kHz lattice)"}
  temperature_after_pgc_uK: {value: {hopping_method: 10, depumping_method: 3.3}, status: thesis, source: "Li p.58, p.71-72"}
  excited_to_ground_lattice_ratio: {value: -0.32, status: computed, note: "model.EXCITED_TO_GROUND_LATTICE; 6P3/2 / 6S1/2 polarizability at 843.222 nm"}
